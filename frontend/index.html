<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natiuk POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <input type="text" placeholder="search item by name or sku" spellcheck="false" id="search-input">
            <button id="search-button">Search</button>
        </div>
        <div class="display-area">

        </div>
        <div class="side-bar">
            <button id="reset-button">Reset</button>
        </div>
        <div class="bottom-bar">
            <h2>Subtotal: <span id="subtotal-display">0.00</span></h2>
            <h2>Tax: <span id="tax-display">0.00</span></h2>
            <h1>TOTAL: <span id="total-display">0.00</span></h1>
            <button id="checkout-button">CHECKOUT</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
